<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruleset Style Practice</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f6fb;
        color: #222;
        margin: 30px;
      }
      header {
        background-color: #b5121b;
        color: white;
        text-align: center;
        padding: 24px;
        border-radius: 10px;
      }
      main {
        max-width: 800px;
        margin: 24px auto;
        background-color: white;
        padding: 24px;
        border-radius: 10px;
      }
      h2 {
        color: #b5121b;
      }
      p {
        line-height: 1.6;
      }
      footer {
        text-align: center;
        color: #555;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Spider-Man</h1>
      <p>A hero who never gives up</p>
    </header>
    <main>
      <h2>About the Character</h2>
      <p>
        Spider-Man is a superhero who tries to use his abilities to help people.
        Peter Parker has to balance everyday responsibilities with being a hero.
      </p>
      <p>A lesson from Spider-Man: helping others matters.</p>
    </main>
    <footer>
      <p>HTML and CSS ruleset practice</p>
    </footer>
  </body>
</html>
