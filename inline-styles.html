<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inline Styles Practice</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f2f6fb;
      color: #222;
      margin: 30px;
    "
  >
    <header
      style="
        background-color: #b5121b;
        color: white;
        text-align: center;
        padding: 24px;
        border-radius: 10px;
      "
    >
      <h1 style="margin-bottom: 8px">Spider-Man</h1>
      <p style="font-size: 18px">A hero who never gives up</p>
    </header>

    <main
      style="
        max-width: 800px;
        margin: 24px auto;
        background-color: white;
        padding: 24px;
        border-radius: 10px;
      "
    >
      <h2 style="color: #b5121b">About the Character</h2>
      <p style="line-height: 1.6">
        Spider-Man is a superhero who tries to use his abilities to help people.
        Peter Parker has to balance everyday responsibilities with being a hero.
      </p>
      <p style="font-weight: bold">
        A lesson from Spider-Man: helping others matters.
      </p>
    </main>

    <footer style="text-align: center; color: #555; padding: 12px">
      <p>HTML practice page</p>
    </footer>
  </body>
</html>
